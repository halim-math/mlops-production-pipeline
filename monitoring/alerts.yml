groups:
  - name: ml-api
    rules:
      - alert: MLInferenceErrorRateHigh
        expr: |
          sum(rate(ml_inference_requests_total{status="error"}[5m]))
          /
          clamp_min(sum(rate(ml_inference_requests_total[5m])), 0.001)
          > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Inference error rate exceeds 2%"

      - alert: MLInferenceP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ml_inference_latency_seconds_bucket[5m]))
          ) > 0.25
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Inference p95 latency exceeds 250 ms"
