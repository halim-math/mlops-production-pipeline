[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-production-pipeline"
version = "0.1.0"
description = "Production-grade reference MLOps platform from data ingestion through monitored inference."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "mlflow>=2.16,<3",
  "dvc>=3.55,<4",
  "boto3>=1.35,<2",
  "prometheus-client>=0.21,<1",
  "evidently>=0.4.39,<1",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "structlog>=24.4,<26",
  "python-json-logger>=2,<4",
  "pyyaml>=6,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=3.8,<5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=mlops_pipeline --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.coverage.run]
branch = true
source = ["mlops_pipeline"]
