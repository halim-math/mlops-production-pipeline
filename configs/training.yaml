project:
  name: churn-classifier
  random_state: 42

data:
  target: churn
  test_size: 0.20
  validation_size: 0.20
  required_columns:
    - tenure_months
    - monthly_spend
    - support_tickets
    - contract_type
    - churn

model:
  algorithm: hist_gradient_boosting
  params:
    learning_rate: 0.08
    max_iter: 250
    max_leaf_nodes: 31
    l2_regularization: 0.1

quality_gates:
  min_f1: 0.72
  min_roc_auc: 0.78
  max_brier_score: 0.22
  max_train_test_f1_gap: 0.12

mlflow:
  experiment_name: production-churn
  registered_model_name: churn-classifier
